name: publish
on:
  push:
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Existing x.y.z tag to publish'
        required: true
        type: string
      comment:
        description: 'Release comment (default: tag annotation)'
        required: false
        type: string
jobs:
  publish:
    name: Publish new version to TER
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      TYPO3_EXTENSION_KEY: nb_headless_content_blocks
      TYPO3_API_TOKEN: ${{ secrets.TYPO3_API_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Get version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            version="$INPUT_VERSION"
          else
            version="${GITHUB_REF/refs\/tags\//}"
          fi

          if ! [[ "$version" =~ ^[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}$ ]]; then
            echo "Version must be an existing tag in format x.y.z"
            exit 1
          fi

          echo "version=$version" >> $GITHUB_ENV

      - name: Verify tag exists
        run: |
          if ! git rev-parse -q --verify "refs/tags/$version" > /dev/null; then
            echo "Tag $version not found — create it first with Build/Scripts/tag-version.sh"
            exit 1
          fi

      - name: Get comment
        env:
          INPUT_COMMENT: ${{ inputs.comment }}
        run: |
          if [ -n "$INPUT_COMMENT" ]; then
            comment="$INPUT_COMMENT"
          else
            comment=$(git tag -n10 -l "$version" | sed "s/^[0-9.]*[ ]*//g")
          fi

          if [[ -z "${comment// }" ]]; then
            comment="Released version $version of $TYPO3_EXTENSION_KEY"
          fi

          {
            echo 'comment<<EOF'
            echo "$comment"
            echo EOF
          } >> "$GITHUB_ENV"

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.2
          extensions: intl, mbstring, json, zip, curl
          tools: composer:v2

      - name: Install tailor
        run: composer global require typo3/tailor --prefer-dist --no-progress

      - name: Publish to TER
        run: php ~/.composer/vendor/bin/tailor ter:publish --comment "${{ env.comment }}" ${{ env.version }}
