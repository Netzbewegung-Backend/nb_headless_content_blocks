services:
  _defaults:
    autowire: true
    autoconfigure: false
    public: false

  Netzbewegung\NbHeadlessContentBlocks\:
    resource: '../Classes/*'

  Netzbewegung\NbHeadlessContentBlocks\DataProcessing\ContentBlocksJsonDataProcessor:
    tags:
        - name: 'data.processor'
          identifier: 'nb-content-blocks-json'

  Netzbewegung\NbHeadlessContentBlocks\DataProcessing\ContainerJsonDataProcessor:
    tags:
        - name: 'data.processor'
          identifier: 'nb-container-json'

  # --- Normalizer registry (tagged services, first supports() wins) ---
  Netzbewegung\NbHeadlessContentBlocks\Normalization\Normalizer\ScalarNormalizer:
    tags: ['nb_headless.normalizer']
  Netzbewegung\NbHeadlessContentBlocks\Normalization\Normalizer\DateTimeNormalizer:
    tags: ['nb_headless.normalizer']
  Netzbewegung\NbHeadlessContentBlocks\Normalization\Normalizer\FlexFormNormalizer:
    tags: ['nb_headless.normalizer']
  Netzbewegung\NbHeadlessContentBlocks\Normalization\Normalizer\TypolinkNormalizer:
    tags: ['nb_headless.normalizer']
  Netzbewegung\NbHeadlessContentBlocks\Normalization\Normalizer\RecordNormalizer:
    tags: ['nb_headless.normalizer']
  Netzbewegung\NbHeadlessContentBlocks\Normalization\Normalizer\RecordCollectionNormalizer:
    tags: ['nb_headless.normalizer']
  Netzbewegung\NbHeadlessContentBlocks\Normalization\Normalizer\FileReferenceNormalizer:
    tags: ['nb_headless.normalizer']
  Netzbewegung\NbHeadlessContentBlocks\Normalization\Normalizer\FolderCollectionNormalizer:
    tags: ['nb_headless.normalizer']

  Netzbewegung\NbHeadlessContentBlocks\Normalization\NormalizerChain:
    arguments:
      $normalizers: !tagged_iterator nb_headless.normalizer
      $unknownTypeNormalizer: '@Netzbewegung\NbHeadlessContentBlocks\Normalization\UnknownTypeNormalizer'

  # autoconfigure is disabled, so the core LoggerAwarePass needs the tag
  # to inject the logger (channel = class name)
  Netzbewegung\NbHeadlessContentBlocks\Normalization\UnknownTypeNormalizer:
    tags: ['psr.logger_aware']

  Netzbewegung\NbHeadlessContentBlocks\ContentBlocks\ContentBlocksIdentifierMapper: ~
  Netzbewegung\NbHeadlessContentBlocks\ContentBlocks\HeadlessYamlLoader:
    arguments:
      $cache: '@cache.runtime'
  Netzbewegung\NbHeadlessContentBlocks\ContentBlocks\IdentifierMapperInterface:
    alias: Netzbewegung\NbHeadlessContentBlocks\ContentBlocks\ContentBlocksIdentifierMapper

  Netzbewegung\NbHeadlessContentBlocks\Normalization\RecordArrayBuilder: ~

  # --- Field value transformers (tagged services) ---
  Netzbewegung\NbHeadlessContentBlocks\FieldTransformer\String\PasswordBlanker:
    tags: ['nb_headless.field_value_transformer']
  Netzbewegung\NbHeadlessContentBlocks\FieldTransformer\String\RichtextParser:
    tags: ['nb_headless.field_value_transformer']

  Netzbewegung\NbHeadlessContentBlocks\FieldTransformer\FieldValueTransformerChain:
    arguments:
      $transformers: !tagged_iterator nb_headless.field_value_transformer
